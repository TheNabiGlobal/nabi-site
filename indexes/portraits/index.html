document.addEventListener('click',e=>{const t=e.target.closest('.t');if(t){const x=P.d.find(y=>y.k===t.dataset.k);$('#m').innerHTML=`<img src="${I(x.k)}" alt="${E(x.n)}"><div><h3>${E(x.n)}</h3><p>${E(x.w)}</p><p><a href="../../search/index.html#${encodeURIComponent(x.q)}">Read about them in Nabi Search ›</a></p><button class="x">‹ Back to the collection</button></div>`;$('#m').classList.add('o');document.body.style.overflow='hidden';return}if(e.target.closest('.x')||e.target.id==='m'){$('#m').classList.remove('o');document.body.style.overflow=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#m').classList.remove('o');document.body.style.overflow=''}});draw();</script></body></html>
